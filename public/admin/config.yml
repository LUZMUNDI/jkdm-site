# Decap CMS config for jkdm.de
backend:
  name: github
  repo: LUZMUNDI/jkdm-site
  branch: main
  base_url: https://twilight-smoke-c210.lucianouniversity2024.workers.dev
  auth_endpoint: auth
  
site_url: https://jeet-kune-do-muenchen.de
display_url: https://jeet-kune-do-muenchen.de

media_folder: "public/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "instructors"
    label: "Über uns — Lehrer"
    files:
      - file: "src/content/teachers/teachers.json"
        label: "Lehrer-Liste"
        name: "teachers"
        fields:
          - label: "Lehrer (zum Umsortieren am ⋮⋮-Griff ziehen)"
            name: "teachers"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Interner Kurzcode (keine Leerzeichen, z.B. dominik)", name: "slug", widget: "string", hint: "Nur intern, wird nicht angezeigt." }
              - { label: "Name (Anzeige)", name: "name", widget: "string" }
              - { label: "Kurzname (Roster)", name: "short", widget: "string" }
              - { label: "Rolle (Roster-Karte)", name: "role", widget: "string" }
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text" }
              - { label: "Pinsel-Zeichen (chinesisch)", name: "brush", widget: "string" }
              - { label: "Foto", name: "image", widget: "image" }
              - label: "Statistiken"
                name: "stats"
                widget: "list"
                fields:
                  - { label: "Wert", name: "value", widget: "string" }
                  - { label: "Beschriftung", name: "label", widget: "string" }

  - name: "testimonials"
    label: "Stimmen — Schüler"
    files:
      - file: "src/content/students/students.json"
        label: "Schüler-Liste"
        name: "students"
        fields:
          - label: "Schüler (zum Umsortieren am ⋮⋮-Griff ziehen)"
            name: "students"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Interner Kurzcode (keine Leerzeichen)", name: "slug", widget: "string", hint: "Nur intern, wird nicht angezeigt." }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Initiale (falls kein Foto)", name: "initial", widget: "string" }
              - { label: "Foto", name: "image", widget: "image", required: false }
              - { label: "Echtes Zitat? (sonst Platzhalter)", name: "isReal", widget: "boolean", default: false }
              - { label: "Disziplin(en)", name: "disc", widget: "string" }
              - { label: "Dabei seit", name: "since", widget: "string" }
              - { label: "Stil-Stichwort", name: "style", widget: "string" }
              - { label: "Zitat", name: "quote", widget: "text" }
              - label: "Statistiken"
                name: "stats"
                widget: "list"
                fields:
                  - { label: "Wert", name: "value", widget: "string" }
                  - { label: "Beschriftung", name: "label", widget: "string" }

  - name: "pages"
    label: "Seiten-Texte & Einstellungen"
    files:
      - file: "src/content/settings/global.json"
        label: "Globale Einstellungen (Preise, Adresse, Footer, Navigation)"
        name: "global"
        fields:
          - { label: "Preis Probetraining", name: "probetrainingPrice", widget: "string", hint: "Wird überall automatisch eingesetzt, wo {{price}} im Text steht." }
          - { label: "Preis Monatsbeitrag (ab)", name: "monthlyPriceFrom", widget: "string", hint: "Wird überall automatisch eingesetzt, wo {{monthlyPrice}} im Text steht." }
          - { label: "Preis Buch", name: "bookPrice", widget: "string", hint: "Wird überall automatisch eingesetzt, wo {{bookPrice}} im Text steht." }
          - { label: "Verkaufte Exemplare (Buch)", name: "bookCopiesSold", widget: "string" }
          - { label: "Trainingszeiten", name: "scheduleLine", widget: "string" }
          - { label: "Adresse — Straße", name: "addressStreet", widget: "string" }
          - { label: "Adresse — Stadt/PLZ", name: "addressCity", widget: "string" }
          - { label: "Adresse — U-Bahn", name: "addressUbahn", widget: "string" }
          - { label: "Instagram — Anzeigename", name: "instagramHandle", widget: "string" }
          - { label: "Instagram — Link", name: "instagramUrl", widget: "string" }
          - { label: "TikTok — Anzeigename", name: "tiktokHandle", widget: "string" }
          - { label: "TikTok — Link", name: "tiktokUrl", widget: "string" }
          - { label: "Footer — Studio-Blurb", name: "footerBlurb", widget: "text" }
          - { label: "Footer — Blurb (fett)", name: "footerBlurbBold", widget: "string" }
          - { label: "CTA-Band — Überschrift", name: "ctaBandHeadline", widget: "string" }
          - { label: "CTA-Band — Text", name: "ctaBandBody", widget: "text", hint: "Tipp: {{price}} wird automatisch durch den Probetraining-Preis ersetzt." }
          - { label: "CTA-Band — Button", name: "ctaBandButton", widget: "string" }
          - { label: "Menüpunkt — Start", name: "navHomeLabel", widget: "string", hint: "Text in der Navigation oben (nicht der Seitentitel)." }
          - { label: "Menüpunkt — Über uns", name: "navAboutLabel", widget: "string" }
          - { label: "Menüpunkt — Training", name: "navTrainingLabel", widget: "string" }
          - { label: "Menüpunkt — Stimmen", name: "navVoicesLabel", widget: "string" }
          - { label: "Menüpunkt — Seminare", name: "navSeminarsLabel", widget: "string" }
          - { label: "Menüpunkt — Buch", name: "navBookLabel", widget: "string" }

      - file: "src/content/aboutPage/about.json"
        label: "Seiten-Titel — Über uns"
        name: "aboutPage"
        fields:
          - { label: "Mode-Tag (kleines Badge über der Überschrift)", name: "mode", widget: "string" }
          - { label: "Seiten-Überschrift", name: "title", widget: "string" }
          - { label: "Untertext", name: "subhead", widget: "text" }

      - file: "src/content/voicesPage/voices.json"
        label: "Seiten-Titel — Stimmen"
        name: "voicesPage"
        fields:
          - { label: "Mode-Tag (kleines Badge über der Überschrift)", name: "mode", widget: "string" }
          - { label: "Seiten-Überschrift", name: "title", widget: "string" }
          - { label: "Untertext", name: "subhead", widget: "text" }
          - { label: "Hinweis-Badge (rot, oben auf der Seite)", name: "disclosureText", widget: "text", required: false, hint: "Leer lassen, um den Hinweis komplett auszublenden." }

      - file: "src/content/seminarsPage/seminars.json"
        label: "Seiten-Titel — Seminare"
        name: "seminarsPage"
        fields:
          - { label: "Mode-Tag (kleines Badge über der Überschrift)", name: "mode", widget: "string" }
          - { label: "Seiten-Überschrift", name: "title", widget: "string" }
          - { label: "Untertext", name: "subhead", widget: "text" }

      - file: "src/content/homePage/home.json"
        label: "Home"
        name: "home"
        fields:
          - { label: "Hero — Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero — Headline", name: "heroHeadline", widget: "string" }
          - { label: "Hero — Subhead", name: "heroSubhead", widget: "text" }
          - { label: "Hero — Haupt-Button", name: "heroPrimaryButton", widget: "string" }
          - { label: "Hero — Sekundär-Button", name: "heroSecondaryButton", widget: "string" }
          - label: "Hero — Stat-Pills"
            name: "heroStats"
            widget: "list"
            fields:
              - { label: "Wert", name: "value", widget: "string" }
              - { label: "Beschriftung", name: "label", widget: "string" }
          - { label: "Minute-Sektion — Label", name: "minuteLabel", widget: "string" }
          - { label: "Minute-Sektion — Titel", name: "minuteTitle", widget: "string" }
          - { label: "Minute-Sektion — Text", name: "minuteBody", widget: "text" }
          - { label: "Minute-Sektion — Zitate", name: "minuteQuotes", widget: "list", field: { label: "Zitat", name: "quote", widget: "string" } }
          - { label: "Minute-Sektion — Schluss", name: "minuteClosing", widget: "string" }
          - { label: "Warum-Sektion — Label", name: "whyLabel", widget: "string" }
          - { label: "Warum-Sektion — Titel", name: "whyTitle", widget: "string" }
          - { label: "Warum-Sektion — Einleitung", name: "whyLead", widget: "text" }
          - label: "Warum-Sektion — Gründe"
            name: "whyReasons"
            widget: "list"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
          - { label: "Disziplinen — Label", name: "disciplinesLabel", widget: "string" }
          - { label: "Disziplinen — Titel", name: "disciplinesTitle", widget: "string" }
          - label: "Disziplinen"
            name: "disciplines"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Chinesisch (optional)", name: "cjk", widget: "string", required: false }
          - { label: "Standort-Zeile", name: "locationLine", widget: "string" }

      - file: "src/content/trainingPage/training.json"
        label: "Training"
        name: "training"
        fields:
          - { label: "Überschrift", name: "headline", widget: "string" }
          - { label: "Subhead", name: "subhead", widget: "text" }
          - label: "Trainingsformate"
            name: "formats"
            widget: "list"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
              - label: "Statistiken"
                name: "stats"
                widget: "list"
                fields:
                  - { label: "Wert", name: "value", widget: "string" }
                  - { label: "Beschriftung", name: "label", widget: "string" }
          - { label: "Standort-Zeile", name: "locationLine", widget: "string" }
          - { label: "CTA-Button", name: "ctaButton", widget: "string" }
          - { label: "Hinweis-Badge", name: "badgeText", widget: "string" }
          - { label: "Video — Label", name: "videoLabel", widget: "string" }
          - { label: "Video — Bildunterschrift", name: "videoCaption", widget: "string" }
          - { label: "Video — Notiz", name: "videoNote", widget: "string" }
          - { label: "Video — Link", name: "videoHref", widget: "string" }
          - { label: "Zweite Sektion — Label", name: "section2Label", widget: "string" }
          - { label: "Zweite Sektion — Titel", name: "section2Title", widget: "string" }
          - { label: "Zweite Sektion — Text", name: "section2Body", widget: "text" }
          - { label: "Zweite Sektion — Button", name: "section2Button", widget: "string" }

      - file: "src/content/bookPage/book.json"
        label: "Buch"
        name: "book"
        fields:
          - { label: "Überschrift", name: "headline", widget: "string" }
          - { label: "Subhead", name: "subhead", widget: "text" }
          - { label: "Bildunterschrift (Cover)", name: "coverCaption", widget: "string" }
          - { label: "Buchtitel", name: "title", widget: "string" }
          - { label: "Beschreibungstext", name: "body", widget: "text" }
          - label: "Stat-Karten"
            name: "statCards"
            widget: "list"
            fields:
              - { label: "Wert", name: "value", widget: "string" }
              - { label: "Beschriftung", name: "label", widget: "string" }
              - { label: "Notiz", name: "note", widget: "string" }
          - { label: "Haupt-Button", name: "primaryButton", widget: "string" }
          - { label: "Sekundär-Button", name: "secondaryButton", widget: "string" }
          - { label: "Badge-Text", name: "badgeText", widget: "string" }

      - file: "src/content/trialPage/trial.json"
        label: "Probetraining"
        name: "trial"
        fields:
          - { label: "Überschrift", name: "headline", widget: "string" }
          - { label: "Subhead", name: "subhead", widget: "text" }
          - label: "Stat-Pills"
            name: "statPills"
            widget: "list"
            fields:
              - { label: "Wert", name: "value", widget: "string" }
              - { label: "Beschriftung", name: "label", widget: "string" }
          - { label: "Warum-Optionen", name: "whyOptions", widget: "list", field: { label: "Option", name: "option", widget: "string" } }
          - { label: "Mitbringen-Optionen", name: "bringOptions", widget: "list", field: { label: "Option", name: "option", widget: "string" } }
          - { label: "Absenden-Button", name: "submitButton", widget: "string" }
          - { label: "Bestätigung — Überschrift", name: "confirmHeadline", widget: "string" }
          - { label: "Bestätigung — Text", name: "confirmBody", widget: "text" }

  - name: "seminars"
    label: "Seminare"
    folder: "src/content/seminars"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    fields:
      - { label: "Reihenfolge", name: "order", widget: "number" }
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Termin (frei, z.B. „12. Oktober 2026“ oder „Termin folgt“)", name: "dateLabel", widget: "string" }
      - { label: "Ort", name: "location", widget: "string", required: false }
      - { label: "Badge (z.B. „Nächster Termin“, „Ausgebucht“, „Vergangen“)", name: "badge", widget: "string", required: false }
      - { label: "Kurzbeschreibung (auf der Karte)", name: "summary", widget: "text" }
      - { label: "Volltext (im Detail-Fenster)", name: "body", widget: "text" }
      - { label: "Titelbild", name: "image", widget: "image", required: false }
      - { label: "Weitere Fotos", name: "gallery", widget: "list", field: { label: "Foto", name: "src", widget: "image" }, required: false }
      - { label: "Button-Text", name: "ctaLabel", widget: "string", default: "Jetzt anmelden" }
      - { label: "Button-Link", name: "ctaHref", widget: "string", default: "/probetraining" }
